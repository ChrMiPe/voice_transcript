[project]
name = "voice-transcript"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "mlx-lm",
    # Whisper laeuft im LLM-Server, nicht in der App — siehe build_app.spec.
    # Zieht torch mit (~490 MB); das ist der Preis fuer die Fachvokabular-Erkennung.
    "mlx-whisper",
    # Fuer die eigene Mikrofonaufnahme (recorder.py). Klein (~1 MB) und muss ins
    # App-Bundle, weil dort aufgenommen wird.
    "pyobjc-framework-AVFoundation",
    "rumps",
    "pyinstaller",
]

[project.scripts]
voice-transcript = "voice_transcript.menubar:main"

[dependency-groups]
# Nur fuer die Entwicklung: `uv sync` installiert sie mit, ins App-Bundle kommt
# davon nichts (siehe build_app.spec/excludes).
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_transcript"]
